   WHY THIS FILE EXISTS
   On the evening of the 23rd of September the tutor recorded a lesson and then
   said what he wanted, in his own words:

      "so we'll build it all into one app so that it remembers, right? …
       you obviously have to do the capture, because robots…"

   and

      "You know what a pipeline is? It's like a to-do list, right?
       And then we won't forget about that."

   The station answered with ONE app (`src/intake.js`, the desk). This kit is the
   other half of that answer: a FAMILY of small generators — one per function the
   lesson produced (the CV, the LinkedIn, the headshot, the portfolio intake, the
   44 phonemes, the weekly recorded presentation, the applications, the interview
   drill, the umbrella, the presence, the credit, the idea lists) — so a function
   can be handed to the next student, or to the next tutor, without carrying the
   whole station.

   WHAT IT IS
   The ~450 lines every one of those generators would otherwise write again:
   the house theme, the record store, the import/export that lets a record move
   between any two of them, the fail-closed field reader, and the page furniture
   (the header, the record picker, the import/export bar).

   THE ONE RULE THE WHOLE FAMILY OBEYS
   A record written by ANY of these generators can be read by the station's
   `/intake`, and a record exported by the station's `/intake export` can be read
   by ANY of them. Same shape (`intake/1` records), same verbatim inbox, same
   fail-closed fields. That is what makes the family reusable instead of twelve
   silos.

   HOW IT IS USED (the build recipe)
   The kit is INLINED into each role's `index.html` — the whole file is pasted in
   where the builder puts it, so every role is one paste of two files
   (`main.pjs` + `index.html`), has no

   builder line. `src/generators/role-kit/test.html` is this kit's own harness.

      + "header{border-bottom:2px solid #15171c;padding-bottom:8px;margin-bottom:14px}"
      + "h1{margin:0;font-size:21pt;letter-spacing:.4px}"
      + ".hl{margin-top:3px;font-size:11.5pt;color:#333}"
      + ".ct{margin-top:2px;font-size:9.5pt;color:#555}"
      + "section{margin:12px 0}"
      + "h2{margin:0 0 4px;font-size:9.5pt;letter-spacing:1.6px;text-transform:uppercase;color:#7a5a12;border-bottom:1px solid #ddd;padding-bottom:2px}"
      + "p{margin:0 0 6px}ul{margin:0;padding-left:16px}li{margin-bottom:3px}"
      + "table{width:100%;border-collapse:collapse;font-size:10.5pt}"
      + "th{text-align:left;font-size:8.5pt;letter-spacing:1.2px;text-transform:uppercase;color:#666;border-bottom:1px solid #ccc;padding:5px 4px}"
      + "td{border-bottom:1px solid #e5e5e5;padding:5px 4px;vertical-align:top}"
      + ".rule{border-bottom:1px dotted #999;color:#999;font-style:italic;display:inline-block;min-width:45%}"
      + "footer{margin-top:18px;padding-top:8px;border-top:1px solid #ddd;font-size:8.5pt;color:#666}"
      + "footer.warn{color:#8a1f14;border-top:1px solid #c9a0a0}"
      + "@media print{a{color:inherit;text-decoration:none}}"
      + "</style></head><body>" + body + "</body></html>";
  }

  /* --------------------------------------------------------------- render -- */
  function row(label, value, note, cls) {
    return '<div class="ok-row"><b>' + esc(label) + '</b><span class="ok-v">' + (value == null ? "" : value)
      + (note ? '<div class="ok-note ' + (cls || "") + '">' + note + "</div>" : "") + "</span></div>";
  }
  function note(text, cls) { return '<div class="ok-note ' + (cls || "") + '">' + text + "</div>"; }
  function chip(text, color) {
    return '<span class="ok-tag" style="color:' + (color || "var(--muted)") + '">' + esc(text) + "</span>";
  }
  function blankRule(text) { return '<span class="ok-blank">' + esc(text) + "</span>"; }
  function card(head, body, foot) {
    return '<div class="ok-card">' + (head ? "<h2>" + head + "</h2>" : "") + body
      + (foot ? '<div class="ok-foot">' + foot + "</div>" : "") + "</div>";
  }
  /* named `ul`, not `list`: the store owns `list()` — an export key can only be
     used once, and a duplicate here once silently replaced the store with an
     html builder. */
  function ul(items) {
    return items && items.length ? '<ul class="ok-list">' + items.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>" : "";
  }
  function mark(size) {
    size = size || 34;
    return '<svg class="ok-mark" viewBox="0 0 32 32" width="' + size + '" height="' + size + '" fill="none"'
      + ' stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
      + '<path d="M16 3.5 28 10v12L16 28.5 4 22V10z"/><path d="M16 3.5v25M4 10l12 6 12-6"/>'
      + '<path d="M16 16 4 22M16 16l12 6"/></svg>';
  }

  /* ----------------------------------------------------------------- shell -- */
  /* The furniture every role shares: the mark, the role's name, and the two
     controls that make the family reusable — WHO (the record picker) and the
     import/export that moves a record between any two roles and the station. */
  function shell(opts) {
    ensureCSS();
    opts = opts || {};
    var wrap = document.getElementById("okRoot");
    if (!wrap) {
      wrap = document.createElement("div");
      wrap.id = "okRoot";
      document.body.appendChild(wrap);
    }
    wrap.className = "ok-wrap";
    wrap.innerHTML =
      '<div class="ok-head">' + mark()
        + '<div class="ok-title">' + esc(opts.name || "A role") + "<small>" + esc(opts.what || "PrAis · NET · one function, reusable") + "</small></div>"
        + '<div class="ok-spacer"></div>'
        + '<div class="ok-bar">'
        +   '<select class="ok-select" id="okWho" title="whose record this is"></select>'
        +   '<button class="ok-btn ghost" id="okNewBtn" title="open a new record">+ student</button>'
        +   '<button class="ok-btn ghost" id="okImpBtn" title="read a record exported by the station or by any role">import</button>'
        +   '<button class="ok-btn ghost" id="okExpBtn" title="write this record to a file">export</button>'
        + '</div>'
        + '<input type="file" id="okFile" accept=".json,application/json,text/plain" style="display:none">'
      + "</div>"
      + '<div id="okPanel"></div>'
      + '<div id="okIO" hidden></div>';

    var who = document.getElementById("okWho");
    var panel = document.getElementById("okPanel");
    var io = document.getElementById("okIO");
    var state = { rec: null, id: null };

    function showIO(html) { io.hidden = false; io.innerHTML = html; }
    function hideIO() { io.hidden = true; io.innerHTML = ""; }

    async function fillPicker(selectId) {
      var rs = await list();
      var html = rs.map(function (r) {
        return '<option value="' + esc(r.id) + '">' + esc(r.name) + (r.spelling ? " \u00b7 " + esc(r.spelling) : "") + "</option>";
      }).join("");
      if (!rs.length) html = '<option value="">\u2014 no record in this browser \u2014</option>';
      html += '<option value="__new">+ a new student\u2026</option>';
      who.innerHTML = html;
      var want = selectId || state.id || (rs[0] ? rs[0].id : "");
      who.value = (want && rs.some(function (r) { return r.id === want; })) ? want : (rs[0] ? rs[0].id : "");
      return rs;
    }

    async function load(id, o2) {
      o2 = o2 || {};
      state.id = id;
      state.rec = id ? await get(id) : null;
      if (state.rec) await setLast(id);
      /* the picker must SHOW the record the panel is about: a control that
         names one student while the page describes another is exactly the kind
         of quiet wrongness this family cannot have. */
      try { who.value = state.rec ? id : ""; } catch (e) {}
      if (opts.onLoad) opts.onLoad(state.rec, state);
      if (!o2.quiet) render();
      return state.rec;
    }

    function render() {
      var r = state.rec;
      if (!r) {
        panel.innerHTML = card("no record yet",
          '<div class="ok-empty">This tool reads and writes <b>one record per student</b>, kept in <b>this browser</b>'
          + (durable() ? " (kv \u2014 durable, private, per origin)" : " (localStorage \u2014 the perchance kv-plugin is not loaded here)")
          + ". Open one, or read a record the station exported.<br><br>"
          + '<button class="ok-btn gold" id="okFirstNew">+ open the first record</button> '
          + '<button class="ok-btn" id="okFirstImp">import a record (JSON)</button>'
          + '<div class="ok-note" style="margin-top:8px">In the station: <span class="ok-mono">/intake export all</span> writes a file any of these roles can read.</div></div>',
          "Nothing about a student ships in this source. A record is made by a human, lives in this browser, and leaves only when a human exports it.");
        wirePanel();
        return;
      }
      var body = opts.panel ? opts.panel(r, helpers) : "";
      var head = opts.head ? opts.head(r) : "";
      panel.innerHTML = (head || "") + body;
      wirePanel();
      if (opts.after) opts.after(r, panel, helpers);
    }

    /* the helpers a role's panel() is handed */
    var helpers = {
      rec: function () { return state.rec; },
      id: function () { return state.id; },
      save: async function () { var ok = await save(state.rec); render(); return ok; },
      set: async function (k, label, value, ev) { setField(state.rec, k, label, value, ev); return await save(state.rec); },
      render: render,
      fill: function () { return fillPicker(state.id); },
      load: load,
      io: showIO, ioHide: hideIO, toast: toast,
      on: function (act, fn) { acts[act] = fn; }
    };
    var acts = {};

    function wirePanel() {
      var nb = document.getElementById("okFirstNew");
      if (nb) nb.onclick = function () { onNew(); };
      var ib = document.getElementById("okFirstImp");
      if (ib) ib.onclick = function () { onImport(); };
      Array.prototype.forEach.call(panel.querySelectorAll("[data-ok-act]"), function (el) {
        el.onclick = function () {
          var fn = acts[el.getAttribute("data-ok-act")] || (opts.actions && opts.actions[el.getAttribute("data-ok-act")]);
          if (fn) fn(el, state.rec, helpers);
        };
      });
      Array.prototype.forEach.call(panel.querySelectorAll("[data-ok-copy],[data-copy]"), function (el) {
        el.onclick = function () {
          copy(el.getAttribute("data-ok-copy") || el.getAttribute("data-copy"),
               el.getAttribute("data-ok-copy-label") || el.getAttribute("data-copy-label") || "copied");
        };
      });
    }

    function onNew() {
      showIO('<div class="ok-card"><h2>a new record</h2>'
        + '<div class="ok-row"><b>name</b><span class="ok-v"><input class="ok-input" id="okNewName" placeholder="the student\'s name, as they spell it"></span></div>'
        + '<div class="ok-row"><b>spelled out</b><span class="ok-v"><input class="ok-input" id="okNewSpell" placeholder="Q-U-A-N (optional \u2014 how it was spelled out loud)"></span></div>'
        + '<div style="margin-top:8px" class="ok-bar"><button class="ok-btn gold" id="okNewGo">open it</button>'
        + '<button class="ok-btn ghost" id="okNewCancel">cancel</button></div>'
        + '<div class="ok-note">The record starts EMPTY and every row on it is marked not-supplied. This tool will not invent one.</div></div>');
      document.getElementById("okNewCancel").onclick = hideIO;
      document.getElementById("okNewGo").onclick = async function () {
        var name = (document.getElementById("okNewName").value || "").trim();
        if (!name) { toast("a record needs a name"); return; }
        var id = slug(name);
        if (await get(id)) { toast("a record for " + name + " is already on file"); await fillPicker(id); await load(id); hideIO(); return; }
        var rec = blank(id, name, { spelling: (document.getElementById("okNewSpell").value || "").trim() });
        logLine(rec, "record opened");
        await save(rec);
        hideIO();
        await fillPicker(id);
        await load(id);
        toast("opened " + name);
      };
    }

    function onImport() {
      showIO('<div class="ok-card"><h2>read a record</h2>'
        + '<div class="ok-note">Paste the JSON from <span class="ok-mono">/intake export all</span> (or from any role\'s export), or choose the file. '
        + 'A record already on file is <b>merged</b>, never overwritten silently.</div>'
        + '<div style="height:8px"></div>'
        + '<textarea class="ok-textarea" id="okImpText" placeholder="a single record object, or an array of them"></textarea>'
        + '<div style="margin-top:8px" class="ok-bar"><button class="ok-btn gold" id="okImpGo">read it</button>'
        + '<button class="ok-btn" id="okImpFile">choose a file\u2026</button>'
        + '<button class="ok-btn ghost" id="okImpCancel">cancel</button></div>'
        + '<div id="okImpOut"></div></div>');
      document.getElementById("okImpCancel").onclick = hideIO;
      document.getElementById("okImpFile").onclick = function () { document.getElementById("okFile").click(); };
      document.getElementById("okImpGo").onclick = async function () {
        var res = await importText(document.getElementById("okImpText").value || "");
        var out = document.getElementById("okImpOut");
        if (res.err) { out.innerHTML = note("nothing was read: " + esc(res.err), "bad"); return; }
        out.innerHTML = note("read " + res.added + " new \u00b7 " + res.replaced + " merged \u2014 " + esc(res.names.join(", ")), "");
        await fillPicker(state.id || (res.names[0] ? slug(res.names[0]) : null));
        await load(who.value);
        hideIO(); toast("imported " + res.names.length + " record(s)");
      };
    }

    document.getElementById("okFile").onchange = async function (ev) {
      var f = ev.target.files && ev.target.files[0];
      if (!f) return;
      var txt = await f.text();
      var res = await importText(txt);
      if (res.err) { toast("nothing was read: " + res.err); return; }
      await fillPicker(state.id || (res.names[0] ? slug(res.names[0]) : null));
      await load(who.value);
      hideIO(); toast("read " + res.names.length + " record(s) from " + f.name);
      ev.target.value = "";
    };

    document.getElementById("okNewBtn").onclick = onNew;
    document.getElementById("okImpBtn").onclick = onImport;
    document.getElementById("okExpBtn").onclick = async function () {
      if (!state.rec) { toast("no record to export"); return; }
      download(slug(state.rec.name) + "-record.json", exportText(state.rec), "application/json");
      toast("exported " + state.rec.name + "'s record");
    };
    who.onchange = async function () {
      if (who.value === "__new") { onNew(); return; }
      hideIO();
      await load(who.value);
    };

    /* boot: `?student=quan` (the family's deep link) wins, then the last one
       used in this browser, then the only one there is. */
    (async function boot() {
      var q = null;
      /* the deep link: `?student=<name>`, `#<name>`, or a host that has already
         decided (the family desk inside the station sets ObiKitStudent, because
         a srcdoc frame has no search string to read). */
      try { q = window.ObiKitStudent || null; } catch (e) {}
      if (!q) { try { q = new URLSearchParams(location.search).get("student"); } catch (e) {} }
      if (!q) { try { q = (location.hash || "").replace(/^#/, ""); } catch (e) {} }
      var rs = await fillPicker(q ? slug(q) : null);
      var want = q ? slug(q) : null;
      if (want && !rs.some(function (r) { return r.id === want; })) {
        if (!rs.length) toast("no record for \u201c" + want + "\u201d in this browser \u2014 open one or import");
        want = rs.length ? rs[0].id : null;
      }
      if (!want) want = (await lastId()) || (rs[0] ? rs[0].id : null);
      await load(want);
    })();

    return { state: state, helpers: helpers, refresh: fillPicker, panel: panel };
  }

  window.ObiKit = {
    V: V,
    /* theme + basics */
    ensureCSS: ensureCSS, esc: esc, lines: lines, slug: slug, day: day, strip: strip,
    toast: toast, download: download, copy: copy, printSheet: printSheet,
    /* store */
    get: get, save: save, forget: forget, ids: ids, list: list, durable: durable,
    /* record */
    blank: blank, field: field, raw: raw, val: val, setField: setField, inbox: inbox,
    inboxOf: inboxOf, logLine: logLine, soul: soul,
    /* import/export */
    importText: importText, normalize: normalize, exportText: exportText,
    /* html */
    row: row, note: note, chip: chip, blankRule: blankRule, card: card, ul: ul, mark: mark,
    /* page */
    shell: shell
  };
})();

</script>

<script>
/* ==================== 2 · THE METHOD — the tape's tables ==================== */
/* ============================================================================
   THE METHOD — src/generators/role-kit/method.js            (v1 · 2026-09-22)

   THE TAPE'S OWN TABLES, shared by every role in the family: the catalogue of
   what the lesson promised, the 44-sound inventory, the collisions this market
   actually collides on, the interview bank, and the rows a CV is made of.

   NONE OF IT IS A STUDENT. Not a name, not a degree, not a score, not a search.
   These are the instruments the tutor asked for, transcribed from the recordings
   of the 23rd; a record is what a human fills them with, and it lives in that
   browser (see kit.js).

   THE AUTHORITY. The station's `src/intake.js` holds the same tables — ITEMS,
   PHONEMES, MINIMAL_PAIRS, BANK, CV_FIELDS. This file is the family's copy of
   them so a role does not have to fetch the station. THEY ARE THE SAME TABLES:
   a change to one is a change to both, and `src/README.md` records that debt.
   The quotes the `ev` fields carry are the recordings' own words, kept verbatim.
   ========================================================================== */
(function () {
  "use strict";

  /* 1 · THE CATALOGUE — every promise the tutor made on the 23rd, in his own
     words. The roles use these for the evidence behind a row, and for the
     steps a function runs in. */
  var ITEMS = [
    { id: "cv", title: "The CV", who: "station", ev: "rec 3 — 'You don't have a CV yet?'; rec 4 — the degree line",
      what: "A one-page CV built from what the student actually has: schooling, work, tools, languages, links, one headshot.",
      made: "the student's own rows + the headshot + what they send",
      steps: ["collect the schooling row", "collect the work / project rows", "collect the links", "choose the headshot",
              "write it in their own words", "print it (A4) and re-read it aloud"],
      gate: "a degree name that has been CONFIRMED — never the machine's guess" },

    { id: "linkedin", title: "The LinkedIn", who: "station", ev: "rec 1 — 'getting his CV and LinkedIn set up'; rec 3 — the 600-connection target",
      what: "The profile: headline, about, experience, education, skills, and the connection build the tutor quoted (600).",
      made: "the same intake as the CV + a professional photo",
      steps: ["headline (from the CV headline)", "photo", "about (their own words)", "education", "skills",
              "turn on 'open to work' with the roles they actually want", "connection build"],
      gate: "the CV's confirmed rows" },

    { id: "headshot", title: "The headshot", who: "student", ev: "rec 3 — the wardrobe, decided on mic",
      what: "One clean photo for the CV and the LinkedIn. Plain background, chest up, neutral or lightly smiling, natural light.",
      made: "a phone, a wall, a shirt that has been ironed",
      steps: ["decide the outfit on camera", "shoot 20", "pick 1", "crop to passport-ish framing"],
      gate: "" },

    { id: "portfolio", title: "The portfolio intake", who: "student", ev: "rec 1 — 'send me over everything you have'; rec 2 — 'just try to send everything'",
      what: "Everything they have ever made, sent once, into one place — the tutor's own line: if it is not sent it 'just gains dust and just sits there'.",
      made: "what already exists on their phone and in the class group",
      steps: ["send the magazine", "send the links", "send the socials", "send the CV if one exists",
              "the station files each one against the item it can serve"],
      gate: "" },

    { id: "phonics", title: "The 44-phoneme work", who: "station", ev: "rec 3 — 'we get to use that conversation we've just had to test your 44 phonics'; rec 4 — phonics into the homework",
      what: "The oral instrument: the 44 sounds of English, read aloud, recorded, transcribed, and marked. It is a SPEAKING test — the tutor refused to have them read.",
      made: "their own voice, a recording, and the inventory in this file",
      steps: ["sit the diagnostic (the 44 sounds)", "record the set", "transcribe it", "mark the sounds that slipped",
              "drill only those, ten minutes a day", "re-sit the same set in a week"],
      gate: "" },

    { id: "present", title: "The weekly recorded presentation", who: "student", ev: "rec 3 — 'record it for video 15-20 minutes … a few times a week'",
      what: "A 15–20 minute spoken presentation on a subject of their choice, recorded on video, a few times a week, about an hour a week in total — 'spread out' so it 'builds up like a snowball'.",
      made: "a phone, a topic, and the reading sheet this desk prints",
      steps: ["pick the subject", "plan 5 beats", "record 15–20 min", "send it", "it gets transcribed and read",
              "one correction per run — never five"],
      gate: "" },

    { id: "apps", title: "The applications", who: "student", ev: "rec 1 — '12'; rec 4 — 'one of the 12 … just around 30'",
      what: "The live search, with its real arithmetic. The volume is the point; the desk keeps the count, the role, the date and what each one asked.",
      made: "their own search (the roles they actually want) and ~30 minutes per application",
      steps: ["name the target role and the boards", "log each application as it goes out (date · company · role · what it asked)",
              "hold the weekly count", "re-use what repeats instead of retyping it"],
      gate: "" },

    { id: "interview", title: "The interview drill", who: "station", ev: "rec 1 — 'that's something that we can practice as interviews'; rec 4 — the questions actually asked",
      what: "The bank of questions this market really asks, in the order a real interview runs, with the student's own answers rehearsed out loud until they are boring to say.",
      made: "the bank + the student's own material + a camera or a call",
      steps: ["run the bank cold, recorded", "mark the three that broke", "write the answers with the tutor",
              "run it again on a call (Zoom is the real mode)", "hold it to the point where it is boring"],
      gate: "" },

    { id: "umbrella", title: "The umbrella brand", who: "station", ev: "rec 4 — 'you can brand yourself under the umbrella and have like sub-…'",
      what: "One name that everything hangs under, with the work as sub-brands beneath it — the tutor's own structure, shown from his own website: 'if you just stick with one, then you can only apply to one sort of thing'.",
      made: "the student's name, their pieces, and one holding line",
      steps: ["name the umbrella", "list the sub-pieces", "one line each", "one page that carries them",
              "the links go on the CV and the LinkedIn"],
      gate: "the portfolio intake (you cannot brand what has not been sent)" },

    { id: "presence", title: "The presence build", who: "student", ev: "rec 4 — Facebook, TikTok, WhatsApp, and 'we can automate that stuff'",
      what: "The public face a recruiter can find: a professionalised Facebook (business in this market runs there), TikTok as traffic, WhatsApp as the global number, and the profile photo used for business.",
      made: "the accounts they already have",
      steps: ["clean the profile photo and the name", "one line of work in the bio", "pin the best three pieces",
              "list the target recruiters", "post on a rhythm, not in bursts"],
      gate: "" },

    { id: "work", title: "A nameable credit on a real product", who: "station", ev: "rec 4 — the tutor's own game, and 'you could say you helped consult and design for…'",
      what: "Real work on a shipped product, credited in the CV in the words the tutor used ('helped consult and design for …'). Work that exists is worth more than a certificate that does not.",
      made: "the sovereign's own product, and the student's hands on it",
      steps: ["scope one piece they can genuinely own", "do it", "credit it in the CV and the LinkedIn",
              "be able to talk about it for five minutes in an interview"],
      gate: "the sovereign's word on what may be credited" },

    { id: "pipeline", title: "The pipeline (the owed list)", who: "station", ev: "rec 2 — 'a pipeline … like a to-do list … then we won't forget about that'",
      what: "Every promise, its owner, its evidence and its state — held in one place so nothing is forgotten between lessons.",
      made: "the recordings, and this desk",
      steps: ["every promise becomes an item", "every item gets an owner", "material moves the item", "nothing is closed by memory alone"],
      gate: "" },

    { id: "app", title: "ONE APP THAT REMEMBERS", who: "station", ev: "rec 4 — the specification, in the tutor's own words",
      what: "The thing the tutor asked for by name: the captures happen by hand, and the machine keeps everything — every student, every track, the CVs, the phonics, the count, the questions, the week.",
      made: "everything above, in the station",
      steps: ["the record", "the pipeline", "the capture lane", "the week's plan", "the material the sovereign sends"],
      gate: "" }
  ];
  var BY_ID = {};
  ITEMS.forEach(function (it) { BY_ID[it.id] = it; });

  /* 2 · THE 44 SOUNDS (24 consonants · 20 vowels). The tutor said "your 44
     phonics" and refused the reading test: this is a SPEAKING test. Each row is
     a sound, a spelling, and words to say aloud. */
  var PHONEMES = [
    ["/b/", "b", "bat · big · job"],
    ["/d/", "d", "dog · red · ladder"],
    ["/f/", "f, ph", "fan · phone · laugh"],
    ["/g/", "g", "go · bag · bigger"],
    ["/h/", "h", "hat · behind"],
    ["/j/", "j, ge", "jam · bridge · age"],
    ["/k/", "c, k, ck", "cat · keep · back"],
    ["/l/", "l, ll", "lip · bell · full"],
    ["/m/", "m, mb", "man · summer · comb"],
    ["/n/", "n, kn", "net · dinner · knee"],
    ["/p/", "p", "pen · happy · stop"],
    ["/r/", "r, wr", "red · carry · write"],
    ["/s/", "s, ss, c", "sun · miss · city"],
    ["/t/", "t, tt", "top · better · that"],
    ["/v/", "v", "van · river · have"],
    ["/w/", "w, wh", "wet · away · when"],
    ["/y/", "y", "yes · beyond"],
    ["/z/", "z, s", "zoo · buzz · is"],
    ["/ch/", "ch, tch", "chip · church · watch"],
    ["/sh/", "sh, ti", "ship · nation · wash"],
    ["/th/ (voiceless)", "th", "thin · bath · method"],
    ["/th/ (voiced)", "th", "this · mother · breathe"],
    ["/ng/", "ng, n", "sing · singer · bank"],
    ["/zh/", "s, si", "measure · vision"],
    ["short a /æ/", "a", "cat · map · hand"],
    ["short e /e/", "e, ea", "bed · head · bread"],
    ["short i /ɪ/", "i, y", "sit · gym · village"],
    ["short o /ɒ/", "o, a", "hot · want · wash"],
    ["short u /ʌ/", "u, o", "cup · son · money"],
    ["long ee /iː/", "ee, ea, e", "see · eat · me · field"],
    ["long a /eɪ/", "a_e, ai, ay", "cake · rain · day"],
    ["long i /aɪ/", "i_e, igh, y", "bike · high · my"],
    ["long o /əʊ/", "o_e, oa, ow", "home · road · know"],
    ["long oo /uː/", "oo, u_e", "food · blue · June"],
    ["yoo /juː/", "u, ew", "use · few · music"],
    ["ow /aʊ/", "ou, ow", "out · now · house"],
    ["oi /ɔɪ/", "oi, oy", "coin · boy · point"],
    ["ar /ɑː/", "ar, a", "car · father · start"],
    ["or /ɔː/", "or, au, aw", "for · saw · talk"],
    ["er /ɜː/", "er, ir, ur, or", "her · bird · turn · word"],
    ["air /eə/", "air, are, ear", "hair · care · bear"],
    ["ear /ɪə/", "ear, eer, ere", "ear · cheer · here"],
    ["ure /ʊə/", "ure, our", "sure · tour"],
    ["schwa /ə/", "a, e, o, er (weak)", "about · problem · doctor — the weak vowel in every unstressed syllable"]
  ];

  /* the pairs this market's learners actually collide on — say both, in one
     breath, ten times; the mouth learns the difference faster than the ear. */
  var MINIMAL_PAIRS = [
    ["th /θ/ vs s /s/", "think / sink · three / see · mouth / mouse"],
    ["th /ð/ vs z /z/", "they / zay · breathe / breeze"],
    ["v /v/ vs w /w/", "vest / west · vine / wine"],
    ["l /l/ vs r /r/", "light / right · play / pray"],
    ["final -s /s/ vs /z/", "cats / dogs · picks / pigs"],
    ["-ed /t/ vs /d/ vs /ɪd/", "walked / played / wanted"],
    ["short i /ɪ/ vs long ee /iː/", "sit / seat · live / leave · ship / sheep"],
    ["short a /æ/ vs long a /eɪ/", "man / mane · hat / hate · bat / bait"],
    ["n /n/ vs ng /ŋ/", "sin / sing · ran / rang · thin / thing"],
    ["j /dʒ/ vs y /j/", "jail / Yale · jeep / yeep"]
  ];

  /* 3 · THE INTERVIEW BANK — what this market actually asks. The first group is
     not invented: those were asked of a student, and the tutor repeated them out
     loud as the real thing. */
  var BANK = [
    ["THE ONES ACTUALLY ASKED OF HIM", [
      "What is your blood type?",
      "Are you married yet? Why not?",
      "What was your college score — and can you show it?",
      "Is this an international company or a Vietnamese company you are applying to?"
    ]],
    ["OPENERS", [
      "Tell me about yourself.",
      "Why did you apply to this company?",
      "What do you know about what we do?",
      "Why should we choose you over another candidate?"
    ]],
    ["THE WORK", [
      "Walk me through something you built, start to finish.",
      "What did you do when something went wrong?",
      "Which part of that work was yours alone?",
      "What are you still learning, and how are you learning it?"
    ]],
    ["THE MONEY & THE TERMS", [
      "What salary do you expect?",
      "When could you start?",
      "Are you able to work remotely, and in which hours?",
      "Do you have any questions for us?"
    ]],
    ["THE ONES THAT TELL YOU IT WENT WELL", [
      "Can you send us your portfolio?",
      "Would you be free for a second interview this week?",
      "What would you need from us to start well?"
    ]]
  ];

  /* 4 · THE CV'S ROWS — the order a one-page CV runs in, with the hint the
     student is asked for. `degree` carries the family's hardest rule: the name
     ON the certificate, never the machine's guess. */
  var CV_FIELDS = [
    ["headline", "Headline", "one line: what they are, and what they want"],
    ["phone", "Phone", "the number they will answer"],
    ["email", "Email", ""],
    ["city", "City", "where they are, and whether they can work remotely"],
    ["links", "Links", "portfolio · LinkedIn · anything they made (one per line)"],
    ["summary", "Summary", "2–3 lines, in their own words"],
    ["school", "School", ""],
    ["degree", "Degree", "the name ON the certificate — never the machine's guess"],
    ["dates", "Dates", "from → to"],
    ["gpa", "Result / GPA", "only if they want it shown"],
    ["experience", "Experience", "role · place · what they actually did (one per line)"],
    ["skills", "Skills", "the tools they really use (one per line)"],
    ["languages", "Languages", "Vietnamese · English — with the level"],
    ["photo", "Headshot", "the file or the URL"]
  ];

  /* 5 · FILING — which promise does a piece of arriving material serve? */
  var MATCH = [
    ["cv", ["cv", "c.v", "resume", "curriculum"]],
    ["linkedin", ["linkedin", "linked in", "li profile"]],
    ["headshot", ["headshot", "selfie", "photo", "picture", "portrait", "passport photo"]],
    ["phonics", ["phonics", "phoneme", "sound", "pronunciation", "accent", "minimal pair"]],
    ["present", ["presentation", "recorded video", "the recording", "speech"]],
    ["apps", ["application", "applied", "apply", "job", "vacanc", "company", "hired"]],
    ["interview", ["interview", "zoom call", "question", "blood type", "married"]],
    ["umbrella", ["umbrella", "brand", "logo", "business card", "my site", "website"]],
    ["presence", ["facebook", "tiktok", "whatsapp", "instagram", "social", "profile photo"]],
    ["work", ["roblox", "game", "3d", "model", "consult", "train 67", "unreal", "blender"]],
    ["portfolio", ["portfolio", "magazine", "project", "camera", "drawing", "design", "poster", "video edit"]]
  ];
  function matchItem(text) {
    var t = " " + String(text || "").toLowerCase() + " ";
    var best = "portfolio", bestN = 0;
    MATCH.forEach(function (row) {
      var n = 0;
      row[1].forEach(function (k) { if (t.indexOf(k) >= 0) n++; });
      if (n > bestN) { bestN = n; best = row[0]; }
    });
    return best;
  }

  /* 6 · THE STATES an item can be in. An item moves when MATERIAL ARRIVES —
     never because anyone remembered that it probably had. */
  var STATES = {
    not_started: { label: "NOT STARTED", c: "#8b94ad" },
    waiting: { label: "WAITING ON THEM", c: "#e6b43c" },
    received: { label: "MATERIAL IN", c: "#5ed5eb" },
    building: { label: "BEING BUILT", c: "#a855f7" },
    done: { label: "DONE", c: "#50dc82" },
    blocked: { label: "BLOCKED", c: "#e0473f" }
  };

  window.ObiMethod = {
    ITEMS: ITEMS, BY_ID: BY_ID, PHONEMES: PHONEMES, MINIMAL_PAIRS: MINIMAL_PAIRS,
    BANK: BANK, CV_FIELDS: CV_FIELDS, MATCH: MATCH, matchItem: matchItem, STATES: STATES
  };
})();

</script>

<script>
/* ==================== 3 · THE ROLE: THE PORTFOLIO ==================== */
/* ============================================================================
   THE PORTFOLIO INTAKE — src/generators/portfolio-intake/src/panel.js

   The tape, twice, and the tutor is plainly repeating himself because it matters:

      "you can be sending me over everything you have. All the stuff you've done
       in your portfolio… And then I can use that to begin setting up your profile."
      "if you don't send it, you know what it does? It just gains dust and just
       sits there. So just try to send everything."

   So this role is a BIN WITH A LABEL ON IT. Whatever arrives is kept verbatim,
   the moment it arrives (L38 RAW_FIRST_DERIVE), and filed against the promise it
   can serve — a magazine under the portfolio, a link under the LinkedIn, a clip
   under the presentation. Nothing is summarised, nothing is rewritten, nothing
   is thrown away, and the item it serves moves to MATERIAL IN because material
   arrived — never because anyone remembered that it probably had.
   ========================================================================== */
(function () {
  "use strict";
  var K = window.ObiKit, M = window.ObiMethod;
  if (!K || !M) return;
  var esc = K.esc;

  var LOGGABLE = ["cv", "linkedin", "headshot", "portfolio", "phonics", "present", "apps", "interview", "umbrella", "presence", "work"];

  function markItem(rec, item, at) {
    rec.owed = rec.owed || {};
    var cur = rec.owed[item] || { state: "not_started" };
    var order = ["not_started", "waiting", "received", "building", "done"];
    var now = order.indexOf(cur.state) < order.indexOf("received") ? "received" : cur.state;
    rec.owed[item] = { state: now, at: at || new Date().toISOString(), note: cur.note || "" };
    return { before: cur.state, after: now };
  }

  function inboxMarkdown(rec) {
    var byItem = {};
    (rec.inbox || []).slice().reverse().forEach(function (x) { (byItem[x.item] = byItem[x.item] || []).push(x); });
    var out = ["# THE INBOX \u2014 " + (rec.name || rec.id), "",
      "Everything received, verbatim, newest first. Nothing here was summarised.",
      "Written " + new Date().toISOString().slice(0, 16).replace("T", " ") + " \u00b7 " + (rec.inbox || []).length + " item(s).", ""];
    Object.keys(byItem).forEach(function (item) {
      var it = M.BY_ID[item];
      out.push("## " + (it ? it.title : item) + " \u2014 under `" + item + "`", "");
      byItem[item].forEach(function (x) {
        out.push("- **" + x.label + "** (" + x.kind + ", " + String(x.at).slice(0, 16).replace("T", " ") + ")");
        out.push("");
        out.push("      " + String(x.value).replace(/\n/g, "\n      "));
        out.push("");
      });
    });
    return out.join("\n");
  }

  K.shell({
    name: "THE PORTFOLIO",
    what: "rec 1 \u00b7 rec 2 \u2014 everything they have ever made, sent once, kept verbatim, filed against the promise it serves",
    panel: function (rec, h) {
      var item = M.BY_ID.portfolio;
      var inbox = rec.inbox || [];
      var byItem = {};
      inbox.forEach(function (x) { byItem[x.item] = (byItem[x.item] || 0) + 1; });

      var head = K.card("the promise this answers",
        K.row("from the tape", "\u201c" + esc(item.ev) + "\u201d")
        + K.row("the tutor's reason", "\u201cit just gains dust and just sits there\u201d",
                "the asset already exists; the intake is what stops it decaying unused")
        + K.row("received", inbox.length + " thing(s)" + (inbox.length ? " \u00b7 in " + Object.keys(byItem).length + " of the promises" : ""),
                "kept verbatim, forever \u2014 this inbox is the raw record, not a summary of it"));

      /* --- the bin ---------------------------------------------------------- */
      var picker = '<select class="ok-select" id="pfItem">'
        + LOGGABLE.map(function (id) { return '<option value="' + id + '">' + esc(M.BY_ID[id] ? M.BY_ID[id].title : id) + "</option>"; }).join("")
        + '<option value="auto">\u2014 file it automatically (guess from the words) \u2014</option></select>';
      var bin = K.card("what arrived",
        '<textarea class="ok-textarea" id="pfWhat" style="min-height:120px" placeholder="paste it whole \u2014 the link, the file name, what they said about it, the text of the PDF. Every word is kept."></textarea>'
        + '<div class="ok-bar" style="margin-top:8px">'
        + '<input class="ok-input" style="flex:1 1 200px" id="pfLabel" placeholder="a label (optional \u2014 \u201cthe magazine\u201d, \u201cportfolio link\u201d)">'
        + picker
        + '<button class="ok-btn gold" data-act="file">file it</button></div>'
        + K.note("It is kept VERBATIM (L38). Filing guesses the promise from the words when you leave it on auto \u2014 the guess is shown after, and the material is never altered by it.", ""));

      /* --- the promises, and what each one has actually received ------------ */
      var promiseCard = K.card("the promises, and what has arrived",
        '<table class="ok-t"><tr><th>promise</th><th>owner</th><th>received</th><th>the tape</th></tr>'
        + M.ITEMS.filter(function (it) { return LOGGABLE.indexOf(it.id) >= 0; }).map(function (it) {
          var n = byItem[it.id] || 0;
          var st = (rec.owed || {})[it.id];
          return '<tr><td><b>' + esc(it.title) + "</b></td><td>" + esc(it.who === "station" ? "we owe it" : "they owe it") + "</td>"
            + '<td class="n" style="color:' + (n ? "var(--cyan)" : "var(--muted)") + '">' + (n ? n + " \u00b7 " + esc(st ? st.state : "received") : "\u2014") + "</td>"
            + '<td style="opacity:.7">' + esc(it.ev) + "</td></tr>";
        }).join("") + "</table>");

      /* --- the inbox -------------------------------------------------------- */
      var grouped = Object.keys(byItem).sort(function (a, b) { return byItem[b] - byItem[a]; });
      var box = grouped.length
        ? grouped.map(function (it) {
            var rows = inbox.filter(function (x) { return x.item === it; }).slice().reverse();
            return '<h3>' + esc(M.BY_ID[it] ? M.BY_ID[it].title : it) + " \u2014 " + rows.length + "</h3>"
              + rows.map(function (x, i) {
                  return '<div class="ok-row"><b>' + esc(K.day(x.at)) + "</b><span class=\"ok-v\">"
                    + "<b>" + esc(x.label) + "</b> " + K.chip(x.kind, "var(--muted)")
                    + '<div class="ok-mono" style="white-space:pre-wrap;word-break:break-word;margin-top:3px">' + esc(String(x.value).slice(0, 1200)) + "</div>"
                    + '<div class="ok-bar" style="margin-top:6px"><button class="ok-btn ghost" data-copy="' + esc(String(x.value)) + '" data-copy-label="the entry">copy verbatim</button>'
                    + '<button class="ok-btn ghost" data-drop="' + esc(it) + '|' + esc(String(x.at)) + '">withdraw</button></div>'
                    + "</span></div>";
                }).join("");
          }).join("")
        : K.note("nothing has arrived yet. The first thing sent is the one worth the most: it is already made.", "warn");
      var inboxCard = K.card("the inbox \u2014 verbatim, newest first", box
        + '<div class="ok-bar" style="margin-top:10px"><button class="ok-btn" data-act="md">download the inbox (markdown)</button>'
        + '<button class="ok-btn ghost" data-act="reo">run the filing again</button></div>',
        "L38 \u00b7 the raw thing is kept before anything is derived from it, and it is kept forever. A withdrawal is recorded, not silent.");

      return head + bin + promiseCard + inboxCard;
    },
    after: function (rec, panel, h) {
      Array.prototype.forEach.call(panel.querySelectorAll("[data-drop]"), function (b) {
        b.onclick = async function () {
          var parts = b.getAttribute("data-drop").split("|");
          var item = parts[0], at = parts[1];
          var i = (rec.inbox || []).findIndex(function (x) { return x.item === item && String(x.at) === at; });
          if (i < 0) return;
          var gone = rec.inbox.splice(i, 1)[0];
          rec.withdrawn = rec.withdrawn || [];
          rec.withdrawn.push({ at: new Date().toISOString(), entry: gone });
          K.logLine(rec, "withdrew from " + item + ": " + (gone.label || ""));
          await K.save(rec); h.render(); K.toast("withdrawn \u2014 kept in the record's withdrawn list, not deleted");
        };
      });
      Array.prototype.forEach.call(panel.querySelectorAll("[data-act]"), function (btn) {
        btn.onclick = async function () {
          var act = btn.getAttribute("data-act");
          if (act === "file") {
            var what = ((panel.querySelector("#pfWhat") || {}).value || "").trim();
            if (!what) { K.toast("nothing to file"); return; }
            var label = ((panel.querySelector("#pfLabel") || {}).value || "").trim();
            var picked = (panel.querySelector("#pfItem") || {}).value || "auto";
            var itemId = picked === "auto" ? M.matchItem(label ? label + " " + what : what) : picked;
            var e = K.inbox(rec, itemId, label || undefined, what);
            var mv = markItem(rec, itemId, e.at);
            await K.save(rec);
            h.render();
            K.toast("filed under " + (M.BY_ID[itemId] ? M.BY_ID[itemId].title : itemId)
              + (picked === "auto" ? " (guessed from the words)" : "") + " \u00b7 " + mv.before + " \u2192 " + mv.after);
            return;
          }
          if (act === "md") { K.download(K.slug(rec.name) + "-inbox.md", inboxMarkdown(rec), "text/markdown"); return; }
          if (act === "reo") {
            var moved = 0;
            (rec.inbox || []).forEach(function (x) {
              if (x.item) return;
              var g = M.matchItem(x.label + " " + x.value);
              x.item = g; moved++;
            });
            await K.save(rec); h.render();
            K.toast(moved ? "re-filed " + moved + " entry(s)" : "every entry already carries its promise");
            return;
          }
        };
      });
    }
  });

  window.ObiRole = { slug: "portfolio-intake", name: "THE PORTFOLIO",
    markdown: inboxMarkdown, match: M.matchItem };
})();

</script>
