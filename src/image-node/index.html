<link rel="stylesheet" href="src/styles.css">

<div id="app">
  <div id="topbar">
    <div class="logo"><span class="grad">PrAis</span> <span class="divider">/</span> <span class="obi">IMAGE</span></div>
    <div class="sub">the umbrella's eye · role: image</div>
    <div class="spacer"></div>
    <button class="tbtn" id="voiceBtn" title="Toggle spoken voice">🔊 <span id="voiceLbl">Voice on</span></button>
    <button class="tbtn" id="memoryBtn" title="Soul DNA memory ledger">◈ <span>Memory</span></button>
  </div>

  <div id="statsEl" class="mem-stats" style="margin:0 0 10px"></div>

  <div id="memoryPanel" class="hidden">
    <div style="font-weight:700; font-size:15px">Soul DNA · prompts captured verbatim (L37)</div>
    <div class="hint" style="margin:4px 0 8px">Every prompt here is a sovereign word — recorded before any picture is made, and synced into the whole organism over CGN.</div>
    <div id="memList"></div>
  </div>

  <div id="composer">
    <button class="iconbtn" id="micBtn" title="Dictate">🎙</button>
    <textarea id="promptInput" rows="1" placeholder="Describe a picture — speak, and the umbrella sees…"></textarea>
    <button class="iconbtn primary" id="genBtn">✦ Generate</button>
  </div>

  <div id="presetChips"></div>

  <div id="result">
    <div class="loader"><div class="spinner"></div>the eye is ready — describe a picture.</div>
  </div>

  <div class="h-head">Recent creations</div>
  <div id="histList"></div>
</div>

<script src="src/app.js"></script>
<script src="src/cgn-node.js"></script>
