<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Careers Academy Ultra Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root {
--neon-purple: #a855f7;
--gold: #f59e0b;
--deep-dark: #0f0f1a;
--glass-bg: rgba(26,26,38,0.7);
--glass-border: rgba(168,85,247,0.2);
--text-primary: #e5e7eb;
--font-ui: Inter, system-ui, sans-serif;
}
body {
margin:0;padding:0;
min-height:100vh; background:var(--deep-dark);
color:var(--text-primary);
font-family: var(--font-ui);
overflow-x: hidden;
position: relative;
}
.blob-bg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:-2;pointer-events:none;}
.blob{position:absolute;border-radius:50%;filter:blur(48px);opacity:0.5;pointer-events:none;}
.blob1{width:500px;height:330px;top:-60px;left:-90px;background:linear-gradient(120deg,var(--neon-purple),var(--gold));animation:blobFloat1 10s infinite alternate;}
.blob2{width:330px;height:280px;top:430px;right:-70px;background:linear-gradient(135deg,var(--gold),var(--neon-purple));animation:blobFloat2 13s infinite alternate;}
.blob3{width:180px;height:220px;bottom:-85px;left:80px;background:linear-gradient(120deg,var(--neon-purple),#23233c);animation:blobFloat3 11s infinite alternate;}
@keyframes blobFloat1{from{transform:translateY(0);}to{transform:translateY(30px);}}
@keyframes blobFloat2{from{transform:translateX(0);}to{transform:translateX(-28px);}}
@keyframes blobFloat3{from{transform:scale(1);}to{transform:scale(1.2);}}
.container {
max-width:700px; margin:0 auto;
background:var(--glass-bg);
border-radius:1.5rem;
box-shadow:0 0 44px var(--neon-purple),0 0 72px var(--gold);
padding:32px 26px 10px 26px;
position:relative; margin-top:64px; margin-bottom:30px;
}
.hero-logo {
font-size:4.5rem;
text-align:center;
line-height:1.03;
font-weight:800;
background:linear-gradient(135deg,var(--neon-purple),var(--gold));
background-clip:text;
-webkit-background-clip:text;
color:transparent;-webkit-text-fill-color:transparent;
margin-bottom:0.4em;
text-shadow:0 0 32px var(--neon-purple);
animation:heroFloat 3.9s cubic-bezier(.56,-0.28,.54,1.45) infinite alternate;
}
.hero-sub {
font-size:1.3rem;
text-align:center;
margin-bottom:2.3rem;
font-weight:600;
color:var(--text-primary);
}
@keyframes heroFloat {
from{transform:translateY(0);} to{transform:translateY(-19px);}
}
.feature-cards {
display:flex;flex-wrap:wrap;gap:1.5rem;justify-content:center;margin-bottom:2.7rem;
}
.feature-card {
background:rgba(28,28,48,0.85);
border-radius:1.05rem;
box-shadow:0 0 22px var(--gold);
padding:1.1rem 1.3rem;
min-width:120px; max-width:180px;
text-align:center; font-size:1.09rem; color:var(--text-primary);
font-weight:700;
transition:transform 0.16s,box-shadow 0.16s;
border:1px solid var(--glass-border);
cursor:pointer;
}
.feature-card:hover { transform:scale(1.06); box-shadow:0 0 30px var(--neon-purple); }
.card-icon { font-size:2.08rem; margin-bottom:0.6rem; text-shadow:0 0 10px var(--gold);}
.start-btn {
margin:2.6rem auto 1.9rem auto;
display:block;
background: linear-gradient(135deg, var(--neon-purple), var(--gold));
color:var(--deep-dark);
font-weight:700;
font-size:1.2rem;
padding:1.1rem 3.2rem;
border:none; border-radius:999px;
cursor:pointer;
box-shadow:0 0 20px var(--neon-purple);
transition:transform 0.16s, box-shadow 0.16s;
}
.start-btn:hover{transform:scale(1.08);}
.coin-bar {
text-align:center; background:rgba(38,38,60,0.61); color:var(--gold);
border-radius:0.8rem; font-size:1.12rem; margin-bottom:1.2rem;
font-family:var(--font-ui); box-shadow:0 0 8px var(--gold); letter-spacing:2px; padding:0.44rem 0 0.37rem 0;
font-weight:700; display:none;
}
.room-block{background:rgba(20,16,32,0.93);border-radius:1rem;box-shadow:0 4px 30px var(--neon-purple);padding:2.04rem 1.28rem 2.37rem 1.28rem;margin-bottom:1.9rem;animation:fadeInRoom 0.7s;will-change:transform,opacity;}
@keyframes fadeInRoom{from{opacity:0;transform:scale(0.97);}to{opacity:1;transform:scale(1);}}
.room-header{display:flex;align-items:center;gap:1.04rem;margin-bottom:1.32rem;}
.room-graphic{font-size:2.35rem;filter:drop-shadow(0 0 16px var(--gold));}
.room-title{font-size:1.19rem;font-weight:700;}
.room-label{font-size:0.96rem;color:var(--gold);margin-left:1rem;background:linear-gradient(135deg,var(--neon-purple),var(--gold));border-radius:999px;padding:0.17rem 0.9rem;box-shadow:0 0 7px var(--gold);}
.room-content{font-size:1.09rem;}
.nav-btns{display:flex;gap:1.17rem;margin-top:2rem;justify-content:center;}
.nav-btn{background:linear-gradient(135deg,var(--neon-purple),var(--gold));color:var(--deep-dark);font-weight:700;border:none;border-radius:999px;padding:0.95rem 2.1rem;font-size:1.04rem;box-shadow:0 0 14px var(--neon-purple);cursor:pointer;font-family:var(--font-ui);transition:background 0.16s, border-color 0.16s, transform 0.16s;}
.nav-btn:disabled{background:#555;color:#222;cursor:not-allowed;opacity:0.7;}
.chatty-choices{margin-top:1.1rem;margin-bottom:2rem;}
.chatty-choices div:first-child{margin-bottom:0.89rem;font-weight:600;}
.chatty-choices button{background:rgba(38,38,60,0.72);border:2px solid var(--neon-purple);color:var(--text-primary);border-radius:999px;margin-bottom:0.65rem;padding:0.77rem 1.34rem;cursor:pointer;transition:background 0.16s, border-color 0.16s, transform 0.16s;font-size:1.02rem;width:100%;font-family:var(--font-ui);box-shadow:0 0 11px var(--neon-purple);will-change:transform; }
.chatty-choices button.selected.correct{font-weight:700;background:linear-gradient(135deg,rgba(34,197,94,0.3),var(--neon-purple) 40%);color:#fff;border-color:var(--gold);box-shadow:0 0 13px var(--gold);}
.chatty-choices button.selected.wrong{font-weight:700;background:linear-gradient(135deg,rgba(239,68,68,0.3),var(--neon-purple) 40%);color:#fff;border-color:#ef4444;animation:shake 0.6s;will-change:transform;}
@keyframes shake{0%,100%{transform:translateX(0);}25%,75%{transform:translateX(-5px);}50%{transform:translateX(5px);}}
.chatty-feedback{margin-top:1.45rem;font-size:1.09rem;font-weight:700;color:var(--gold);background:rgba(38,38,60,0.81);border-radius:0.8rem;text-align:center;padding:1.02rem;box-shadow:0 0 11px var(--gold);transition:background 0.16s, border-color 0.16s, transform 0.16s;min-height:2.3rem;}
.chatty-feedback.feedback-correct{color:#bbf7d0;}
.chatty-feedback.feedback-wrong{color:#fca5a5;}
.chatty-feedback.empty{display:none;}
@media (max-width:720px){
.container{max-width:99vw;margin:0;border-radius:0;box-shadow:none;padding:0.5rem 0.1rem;}
.room-block{padding:1.2rem 0.3rem;}
.feature-cards{gap:0.7rem;}
.hero-logo{font-size:2.75rem;}
}
.nav-btn:focus-visible,.chatty-choices button:focus-visible{outline:2px solid var(--gold);}
</style>
</head>
<body>
<div class="blob-bg">
<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>
</div>
<div class="container" role="main">
<div id="landing">
<div class="hero-logo">Careers<br>Ultra Edition</div>
<div class="hero-sub">Get ready for real-world jobs & future skills — discover, play, and practice, all in English!</div>
<div class="feature-cards">
<div class="feature-card"><div class="card-icon">🌏</div>Real & Future Jobs</div>
<div class="feature-card"><div class="card-icon">💡</div>Skill Practice</div>
<div class="feature-card"><div class="card-icon">🎲</div>Fun Quizzes</div>
<div class="feature-card"><div class="card-icon">🏆</div>Mastery & Rewards</div>
</div>
<button id="start-btn" class="start-btn">🚀 Start Lesson</button>
</div>
<div id="coin-bar" class="coin-bar"></div>
<div id="engine"></div>
</div>
<script>
"use strict";
(function(){
// --- Data: Careers Rooms ---
const rooms = [
{
graphic:'🏠', title:'Entrance', label:'Warm-Up', content:`
            <div>Welcome to the <strong>Careers Academy Ultra</strong>!<br>🛤️ Today, you'll explore jobs, future careers, and build real skills.</div>
            <ul style="margin-top:1rem;">
              <li>Discover awesome jobs: Teacher, Coder, Doctor, Designer, Mechanic</li>
              <li>Peek into the future: AI Technician, Robot Mechanic, Drone Pilot</li>
              <li>Grow key skills: Teamwork, Focus, Creativity</li>
              <li>Master English with mini-quizzes and tasks</li>
            </ul>
         `
},
{
graphic:'🔎', title:'Explore Jobs', label:'Jobs', content:`
            <div><strong>Popular Jobs:</strong></div>
            <ul style="margin:0.7rem 0 0.7rem 0;">
              <li>👩‍🏫 Teacher – helps students learn, explains ideas</li>
              <li>🧑‍💻 Software Developer (Coder) – builds computer programs</li>
              <li>👩‍🎨 Designer – creates art and graphics</li>
              <li>👨‍🔧 Mechanic – repairs cars and machines</li>
              <li>👩‍⚕️ Doctor – checks health, helps people feel better</li>
            </ul>
            <div style="margin-top:1rem;"><strong>Future Careers:</strong>
              <ul>
                <li>🤖 AI Technician – works with robots and computers</li>
                <li>👨‍🔧 Robot Mechanic – fixes robot helpers</li>
                <li>🛸 Drone Operator – flies drones for deliveries</li>
              </ul>
            </div>`
},
{
graphic:'🛠️', title:'Essential Skills', label:'Skills', content:`
            <div><strong>Top Skills for Any Career:</strong></div>
            <ul>
              <li>🧠 Focus — do your work carefully, pay attention</li>
              <li>🤝 Teamwork — work well with other people</li>
              <li>💡 Creativity — new ideas, solving problems</li>
              <li>🗣️ Communication — listen and speak clearly</li>
              <li>🔧 Problem-solving — fixing challenges, finding solutions</li>
            </ul>
            <div style="margin-top:1rem;">Great jobs need great skills!</div>
         `
},
{
graphic:'🧪', title:'Practice Room', label:'Quiz!', content:`
            <div>Practice time! Pick the best answers:</div>
            <div class="chatty-choices" data-correct-feedback="🎉 Correct! (+10 Coins)" data-wrong-feedback="❌ Try again — review the jobs.">
              <div><strong>1. Who creates computer programs?</strong></div>
              <button data-answer="correct">A. Software Developer</button>
              <button data-answer="wrong">B. Mechanic</button>
              <button data-answer="wrong">C. Doctor</button>
            </div>
            <div class="chatty-choices" data-correct-feedback="🎉 Great! (+10 Coins)" data-wrong-feedback="❌ Not quite — think about skills.">
              <div><strong>2. Which skill is about working with others?</strong></div>
              <button data-answer="wrong">A. Focus</button>
              <button data-answer="correct">B. Teamwork</button>
              <button data-answer="wrong">C. Creativity</button>
            </div>
            <div class="chatty-feedback" aria-live="polite"></div>
         `
},
{
graphic:'🔑', title:'Mastery Exit', label:'Finish', content:`
            <div class="summary-card">
              <strong>🏆 Lesson Complete!</strong>
              <ul>
                <li>Discovered 8 jobs + 5 key skills</li>
                <li>Practiced with quizzes and examples</li>
                <li>Ready for real-world success!</li>
              </ul>
              <div style="margin-top:1.1rem;"><strong>Writing Task:</strong></div>
              <textarea id="career-write" placeholder="Write 2–3 sentences: What job do you want and why?" style="width:98%;min-height:70px;border-radius:0.6rem;margin-top:0.8rem;border:1.5px solid var(--neon-purple);background:rgba(38,38,60,0.20);color:var(--text-primary);font-size:1rem;"></textarea>
            </div>
         `
}
];
let currentRoom = 0, coins = 100;
const landing = document.getElementById('landing'), engineEl = document.getElementById('engine'), coinBarEl = document.getElementById('coin-bar');
function showLesson() {
landing.style.display="none";
coinBarEl.style.display="";
render();
}
function gotoRoom(idx){ currentRoom=idx; render(); }
function feedbackReset() {
var fb=engineEl.querySelector('.chatty-feedback');
if(fb){ fb.textContent=''; fb.className='chatty-feedback empty'; }
engineEl.querySelectorAll('.chatty-choices button').forEach(b=>{b.classList.remove('selected','correct','wrong');b.disabled=false;});
}
function renderCoinBar(){ coinBarEl.textContent = `Coins: ${coins}`; }
function render() {
const room=rooms[currentRoom];
const isLastRoom = currentRoom===rooms.length-1;
renderCoinBar();
engineEl.innerHTML =
`<div class="room-block" role="region">
            <div class="room-header">
              <div class="room-graphic">${room.graphic}</div>
              <div class="room-title">${room.title}</div>
              <span class="room-label">${room.label}</span>
            </div>
            <div class="room-content">${room.content}</div>
            <div class="nav-btns">
              <button class="nav-btn" data-action="prev" ${currentRoom===0?'disabled':''}>Back</button>
              <button class="nav-btn" data-action="${isLastRoom?'restart':'next'}">${isLastRoom?'Restart Lesson':'Next'}</button>
            </div>
          </div>`;
}
document.getElementById('start-btn').addEventListener('click',showLesson);
engineEl.addEventListener('click',function(e){
if(e.target.matches('.nav-btn[data-action="prev"]')){
if(currentRoom>0){feedbackReset();gotoRoom(currentRoom-1);}
}
if(e.target.matches('.nav-btn[data-action="next"]')){
if(currentRoom<rooms.length-1){feedbackReset();gotoRoom(currentRoom+1);}
}
if(e.target.matches('.nav-btn[data-action="restart"]')){
feedbackReset();gotoRoom(0);
}
if(e.target.matches('.chatty-choices button[data-answer]')){
feedbackReset();
const btn = e.target;
const block = btn.closest('.chatty-choices');
if(!block)return;
block.querySelectorAll('button').forEach(b=>b.disabled=true);
btn.classList.add('selected');
if(btn.getAttribute('data-answer')==='correct'){
btn.classList.add('correct'); coins+=10;
renderCoinBar();
showFeedback(block.dataset.correctFeedback,'correct');
} else {
btn.classList.add('wrong');
coins = Math.max(0, coins-5);
renderCoinBar();
showFeedback(block.dataset.wrongFeedback,'wrong');
}
}
},true);
function showFeedback(msg,type) {
var fb=engineEl.querySelector('.chatty-feedback');
if(fb){ fb.className='chatty-feedback feedback-'+type; fb.textContent=msg; }
}
})();
</script>
</body>
</html>
